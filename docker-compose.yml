services:
  api:
    build: .
    container_name: esp32-gps-tracker
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      # SQLite file lives on the named volume below, so data survives
      # `docker compose down` / container recreation. Point this at a
      # postgres:// URL instead if you'd rather use Postgres.
      DATABASE_URL: sqlite:////app/data/gps_tracker.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-esp32-gps-tracker}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:-admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cattle-gps-tracker-system.vercel.app}
    volumes:
      - gps_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  gps_data:
